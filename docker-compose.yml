services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile

    container_name: eventbook-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    restart: unless-stopped


  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile

    container_name: eventbook-frontend

    ports:
      - "3000:3000"

    env_file:
      - ./frontend/.env

    restart: unless-stopped