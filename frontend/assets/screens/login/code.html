<div class="flex flex-col items-center text-center">
<div class="w-12 h-12 rounded-xl bg-primary-fixed flex items-center justify-center text-primary mb-space-md shadow-sm">
<svg class="w-6 h-6" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M4 8C4 6.89543 4.89543 6 6 6H18C19.1046 6 20 6.89543 20 8V10C18.8954 10 18 10.8954 18 12C18 13.1046 18.8954 14 20 14V16C20 17.1046 19.1046 18 18 18H6C4.89543 18 4 17.1046 4 16V14C5.10457 14 6 13.1046 6 12C6 10.8954 5.10457 10 4 10V8Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M10 6V18" stroke="currentColor" stroke-dasharray="2 2" stroke-linecap="round" stroke-width="1.75"></path>
<path d="M14 9H16" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path>
<path d="M14 13H15" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path>
</svg>
</div>
<span class="font-label-sm text-label-sm text-primary uppercase tracking-wider mb-space-xs">EventBook Access</span>
<h1 class="font-headline-md text-headline-md text-on-surface">Welcome back</h1>
<p class="font-body-md text-body-md text-secondary mt-space-xs max-w-xs">
        Enter your credentials to manage your event bookings and ticket passes
      </p>
</div>
<!-- Error Banner Demonstration -->
<div class="mt-space-lg flex items-start gap-space-sm p-space-md rounded-lg bg-error-container text-on-error-container" id="error-banner">
<span class="material-symbols-outlined text-error flex-shrink-0" style="font-size: 20px; line-height: 22px;">error</span>
<div class="flex-1">
<p class="font-body-sm text-body-sm text-on-error-container font-medium">
          Invalid email or password. Please verify your login details and try again.
        </p>
</div>
<button aria-label="Dismiss message" class="text-on-error-container hover:opacity-75 transition-opacity" onclick="document.getElementById('error-banner').style.display='none'" type="button">
<span class="material-symbols-outlined" style="font-size: 18px; line-height: 20px;">close</span>
</button>
</div>
<!-- Login Form -->
<form class="mt-space-lg flex flex-col gap-space-md" onsubmit="event.preventDefault();">
<!-- Email Address Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email address</label>
<div class="relative flex items-center">
<input class="w-full h-11 px-space-md bg-surface-container-lowest rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-low transition-colors shadow-sm" id="email" placeholder="you@domain.com" required="" type="email" value="alex.rivera@eventbook.io"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<input class="w-full h-11 pl-space-md pr-11 bg-surface-container-lowest rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-low transition-colors shadow-sm" id="password" placeholder="Enter password" required="" type="password" value="••••••••••••"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 h-11 w-11 flex items-center justify-center text-secondary hover:text-on-surface transition-colors" id="toggle-password" type="button">
<span class="material-symbols-outlined" id="eye-icon" style="font-size: 20px;">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-space-sm pt-space-xs">
<input checked="" class="w-4 h-4 rounded text-primary bg-surface-container-lowest accent-primary cursor-pointer" id="remember-me" type="checkbox"/>
<label class="font-body-sm text-body-sm text-secondary select-none cursor-pointer" for="remember-me">
          Remember this device for 30 days
        </label>
</div>
<!-- Primary Action -->
<button class="w-full h-12 mt-space-sm bg-primary-container hover:bg-primary text-on-primary rounded-xl font-label-md text-label-md transition-all shadow-md active:scale-[0.99] flex items-center justify-center gap-space-xs" type="submit">
<span>Log in</span>
<span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-space-lg flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full h-[1px] bg-surface-container-high"></div>
</div>
<span class="relative px-space-md bg-surface-container-lowest font-label-sm text-label-sm text-secondary">
        or continue with
      </span>
</div>
<!-- Mock SSO Buttons -->
<div class="grid grid-cols-2 gap-space-md">
<button class="h-11 px-space-md rounded-xl bg-surface-container-low hover:bg-surface-container text-on-surface flex items-center justify-center gap-space-sm transition-colors shadow-sm" type="button">
<svg class="w-4 h-4 flex-shrink-0" viewbox="0 0 24 24">
<path d="M12 5c1.54 0 2.92.53 4.02 1.57l3.01-3.01C17.2 1.8 14.77 1 12 1 7.42 1 3.51 3.6 1.63 7.37l3.64 2.82C6.15 7.27 8.84 5 12 5z" fill="#EA4335"></path>
<path d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58l3.71 2.87c2.16-2 3.71-4.94 3.71-8.69z" fill="#4285F4"></path>
<path d="M5.27 14.81c-.24-.72-.38-1.49-.38-2.31s.14-1.59.38-2.31L1.63 7.37C.59 9.45 0 11.66 0 14c0 2.34.59 4.55 1.63 6.63l3.64-2.82z" fill="#FBBC05"></path>
<path d="M12 23c3.24 0 5.95-1.08 7.93-2.91l-3.71-2.87c-1.07.73-2.45 1.16-4.22 1.16-3.16 0-5.85-2.27-6.73-5.19L1.63 16c1.88 3.77 5.79 6.37 10.37 6.37z" fill="#34A853"></path>
</svg>
<span class="font-label-md text-label-md">Google</span>
</button>
<button class="h-11 px-space-md rounded-xl bg-surface-container-low hover:bg-surface-container text-on-surface flex items-center justify-center gap-space-sm transition-colors shadow-sm" type="button">
<svg class="w-4 h-4 flex-shrink-0 fill-current" viewbox="0 0 24 24">
<path clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" fill-rule="evenodd"></path>
</svg>
<span class="font-label-md text-label-md">GitHub</span>
</button>
</div>
<!-- Registration Link Footer -->
<div class="mt-space-xl text-center">
<p class="font-body-md text-body-md text-secondary">
        New here? 
        <a class="font-label-md text-label-md text-primary font-semibold hover:underline ml-1" href="#">
          Create an account
        </a>
</p>
</div>
</div>
<!-- Trust Meta Badge -->
<div class="mt-space-md flex items-center justify-center gap-space-sm text-secondary">
<span class="material-symbols-outlined text-outline" style="font-size: 16px;">lock</span>
<span class="font-label-sm text-label-sm text-secondary">256-bit encrypted authentication</span>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('toggle-password');
    const pwdInput = document.getElementById('password');
    const icon = document.getElementById('eye-icon');
    
    if (toggleBtn && pwdInput && icon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        icon.textContent = isPassword ? 'visibility' : 'visibility_off';
      });
    }
  })();
</script></main></body></html>
